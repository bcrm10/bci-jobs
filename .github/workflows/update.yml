name: Actualizar BCI Jobs

on:
  schedule:
    - cron: "0 */3 * * *"     # cada 3 horas (UTC)
  workflow_dispatch:           # botón para correrlo a mano
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python radar_bci.py --ci
      - name: Publicar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html bci_offers_cache.json
          git commit -m "Actualiza ofertas $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          git push
